name: 'CI Builds'
run-name: "CI Builds ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  check-gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
      - name: 'Set up JDK'
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Init Gradle Build Action
        uses: gradle/actions/setup-gradle@v5
        with:
            cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: 'Check Spock'
        run: ./gradlew check
  check-maven:
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: test-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            test-${{ runner.os }}-maven-
      - name: 'Set up JDK'
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: 'Check Spock'
        run: |
          ./mvnw -V -B verify
  check-ant:
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
      - name: Cache Ivy download cache
        uses: actions/cache@v5
        with:
          path: ~/.ivy2
          key: test-${{ runner.os }}-ivy-${{ hashFiles('ivy.xml', 'ivysettings.xml') }}
          restore-keys: |
            test-${{ runner.os }}-ivy-
      - name: 'Set up JDK'
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: 'Check Spock'
        run: |
          ant test
